name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 11.x.x

    - name: Restore dependencies
      run: |
        dotnet restore FishLink.API/FishLink.API.csproj
        dotnet restore FishLink.API.Tests/FishLink.API.Tests.csproj

    - name: Build
      run: dotnet build FishLink.API/FishLink.API.csproj --no-restore
    - name: Backend unit tests
      run: dotnet test FishLink.API.Tests/FishLink.API.Tests.csproj --no-restore
    - name: Agentic AI helper tests
      working-directory: ai_agent
      run: |
        python -m pip install -r requirements.txt
        python -m unittest discover -s tests -v
    - name: Web client
      working-directory: fishlink-dashboard
      run: |
        npm ci
        npm run build
    - name: Flutter client
      uses: subosito/flutter-action@v2
      with:
        channel: stable
    - name: Build Android APK
      working-directory: fishlink_mobile
      run: flutter build apk --release --dart-define=FISHLINK_API_URL=${{ secrets.FISHLINK_API_URL }}
    - run: flutter pub get
      working-directory: fishlink_mobile
    - run: flutter analyze
      working-directory: fishlink_mobile
    - run: flutter test
      working-directory: fishlink_mobile
