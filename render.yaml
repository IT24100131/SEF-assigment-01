services:
  - type: web
    name: fishlink-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: FishLinkAPI
      - key: Jwt__Audience
        value: FishLinkClients
      - key: AiAgent__BaseUrl
        sync: false
      - key: PriceApi__BaseUrl
        sync: false
